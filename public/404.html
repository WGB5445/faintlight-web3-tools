<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0;url=/faintlight-web3-tools/" />
    <script>
      (function(l) {
        var basePath = '/faintlight-web3-tools';
        var pathname = l.pathname || '/';
        var search = l.search || '';
        var hash = l.hash || '';

        if (!pathname.startsWith(basePath)) {
          basePath = '';
        }

        var remainder = pathname.slice(basePath.length) || '/';
        if (!remainder.startsWith('/')) {
          remainder = '/' + remainder;
        }

        try {
          sessionStorage.setItem('spa-redirect:path', remainder);
          sessionStorage.setItem('spa-redirect:search', search);
          sessionStorage.setItem('spa-redirect:hash', hash);
        } catch (error) {
          console.warn('Failed to persist redirect data', error);
        }

        var target = basePath ? basePath + '/' : '/';
        l.replace(target);
      })(window.location);
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
